name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Validate Contracts & Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest
          pip install -e packages/contracts
      - name: Test Contracts
        run: |
          pytest packages/contracts/tests -v

  services-test:
    name: Microservices Unit Tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi pydantic jinja2 cryptography networkx "langgraph>=0.2.60"
          pip install -e packages/contracts
      - name: Run Tests
        run: |
          pytest services/launcher/tests \
                 services/orchestrator/tests \
                 services/scanner-intel/tests \
                 services/remediation-engine/tests -v

  eval-runner:
    name: Run Golden & Red-Team E2E Evaluation
    runs-on: ubuntu-latest
    needs: services-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi pydantic jinja2 cryptography
          pip install -e packages/contracts
      - name: Run E2E Gate Evaluation
        run: |
          python tests/eval_runner.py --suite all
