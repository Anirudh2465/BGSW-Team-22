[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-launcher"
version = "0.1.0"
description = "Exclusive Docker socket holder & sandbox execution plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "guardian-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
markers = [
    "docker: needs a Docker daemon and the built sandbox images (opt-in: DOCKER_AVAILABLE=1)",
]
