[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-orchestrator"
version = "0.1.0"
description = "FastAPI gateway, LangGraph 9-node/9-gate state machine, and Ed25519 audit chain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "apscheduler>=3.10.4",
    "langgraph>=0.2.60",
    "psycopg[binary]>=3.1.18",
    "neo4j>=5.20.0",
    "guardian-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
