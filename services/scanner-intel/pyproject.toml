[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-scanner-intel"
version = "0.1.0"
description = "Cartographer, Discover, Detector & LLM adapter for supply chain intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "networkx>=3.2.0",
    "cvss==3.6",
    "pyyaml>=6.0",
    "guardian-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.detectors" = ["data/*.txt", "data/*.json"]
